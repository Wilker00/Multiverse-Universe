version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /etc, /proc, /dev/urandom]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  node_registry:
    endpoints:
      - { host: registry.npmjs.org, port: 443, protocol: tcp }
    binaries:
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/pnpm }
      - { path: /usr/local/bin/yarn }
