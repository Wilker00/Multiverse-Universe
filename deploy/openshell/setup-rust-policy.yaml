version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /etc, /proc, /dev/urandom]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  rust_registries:
    endpoints:
      - { host: crates.io, port: 443, protocol: tcp }
      - { host: index.crates.io, port: 443, protocol: tcp }
      - { host: static.crates.io, port: 443, protocol: tcp }
    binaries:
      - { path: /usr/bin/cargo }
