[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse-core"
version = "0.3.0"
description = "A bounded evaluation harness for verified agent memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
multiverse-core = "multiverse_core.__main__:main"

[tool.setuptools.packages.find]
include = ["multiverse_core*"]

[tool.setuptools.package-data]
multiverse_core = [
  "studio_live.html",
  "tasks_data/**/*.json",
  "tasks_data/**/*.py",
]
